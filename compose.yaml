services:
  caxton:
    build:
      context: .
    image: caxton:local
    container_name: caxton
    restart: unless-stopped
    ports:
      - "${CAXTON_PORT:-8080}:8080"
    environment:
      CAXTON_SCAN_INTERVAL: "${CAXTON_SCAN_INTERVAL:-5m}"
    volumes:
      - ./books:/books:ro
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
